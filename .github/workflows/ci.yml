name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dev-dependencies (ESLint + Prettier)
        run: npm ci --ignore-scripts

      - name: Install client dependencies (for ESLint)
        run: npm ci --ignore-scripts
        working-directory: client

      - name: Lint server + tests (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

  # ─── Server tests ────────────────────────────────────────────
  test:
    name: Server Tests
    runs-on: ubuntu-latest
    # Tests use the built-in in-memory store; no real DB needed
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-at-least-32-chars-long-here
      ADMIN_SIGNUP_CODE: ci-test-admin-code-for-actions
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      PORT: 5000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci --ignore-scripts
        working-directory: server

      - name: Start server in background
        run: node server/server.js &
        env:
          NODE_ENV: test

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/api/health > /dev/null 2>&1; then
              echo "Server is ready"
              break
            fi
            echo "Waiting... ($i/20)"
            sleep 1
          done

      - name: Run auth test suite
        run: node test-auth.js

      - name: Run teams test suite
        run: node test-teams.js

      - name: Run scores test suite
        run: node test-scores.js

      - name: Run features verification suite
        run: node test-features-verification.js

      - name: Run tournament verification suite
        run: node test-tournaments-verification.js

  # ─── Client build ────────────────────────────────────────────
  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client (Vite)
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: /api

      - name: Check bundle size (main chunk must be < 600 KB)
        run: |
          MAIN_JS=$(find client/dist/assets -name 'index-*.js' | head -1)
          if [ -z "$MAIN_JS" ]; then
            echo "ERROR: Could not find main JS bundle"
            exit 1
          fi
          SIZE=$(wc -c < "$MAIN_JS")
          echo "Main bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 614400 ]; then
            echo "ERROR: Main bundle (${SIZE}B) exceeds 600 KB limit. Please lazy-load route components."
            exit 1
          fi
          echo "Bundle size check PASSED"
